# cart_driver in road_follower's road_loop world (7 m road with curbs, no
# route): keep to the middle of the road with the road-centre cost only.
cart_driver:
  ros__parameters:
    vehicle: tesla_sim
    cruise_kmh: 5.0
    speed_topic: /vehicle/speed
    speed_scale: 1.0
    imu_topic: /vehicle/imu
    route_file: ''                   # no route in this world
    road_centre: true
    centre_max_age: 1.0

cart_safety:
  ros__parameters:
    vehicle: tesla_sim
    coast_decel: 0.4
    speed_topic: /vehicle/speed
    speed_scale: 1.0
